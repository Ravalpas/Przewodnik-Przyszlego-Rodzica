<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weryfikacja źródeł · Przewodnik Przyszłego Rodzica</title><link rel="stylesheet" href="styles.css"><style>body{max-width:940px;margin:auto;padding:30px 20px;background:#f7f9fd}h1{font-size:27px}h2{font-size:19px}article{background:white;border:1px solid #dfe7f3;padding:24px;border-radius:20px;margin:22px 0}pre{white-space:pre-wrap;overflow:auto;max-height:220px;font:12px/1.6 system-ui;padding:14px;background:#f5f7fc}textarea{width:100%;min-height:130px;font:13px/1.6 system-ui;border:1px solid #dce2ee;border-radius:12px;padding:12px}label{display:block;margin:14px 0 6px;font-size:12px}fieldset{border:1px solid #dfe7f3;border-radius:14px;margin:20px 0;padding:15px}legend{font-size:13px;font-weight:700}.rules{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}button{margin-top:15px}a{color:#3262b4}.notice{color:#5475aa;font-size:12px;line-height:1.7}#status{font-size:13px;color:#4265a5}</style></head><body><a href="/">← Aplikacja</a><h1>Weryfikacja oficjalnych źródeł</h1><p>Panel redakcyjny właściciela. Porównaj dokumenty, sprawdź podstawę prawną i datę wejścia w życie. Zatwierdzenie nie odbywa się automatycznie.</p><label for="admin-token">Token administratora (tylko przy wdrożeniu kontenerowym, jeśli ustawiony)</label><input id="admin-token" type="password" autocomplete="off"><button id="reload" class="secondary">Pokaż zmiany do sprawdzenia</button><p id="status" role="status"></p><main id="reviews"></main><script type="module" src="admin.js"></script><script type="module" src="calculator-admin.js"></script><style>.ca-parameters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ca-parameters label{font-size:14px}#calculator-administration p{font-size:16px}#calculator-administration summary{font-size:16px;cursor:pointer;margin:20px 0}#calculator-administration textarea{font-size:15px}@media(max-width:600px){.ca-parameters{grid-template-columns:1fr}}</style></body></html>

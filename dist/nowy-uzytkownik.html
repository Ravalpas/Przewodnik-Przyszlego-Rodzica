<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nowy początek · Przewodnik Przyszłego Rodzica</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone-shell"><div class="loading" role="status"><img src="assets/logo.svg" alt=""><p id="reset-status">Przygotowujemy nowy początek…</p><a id="reset-return" href="./" hidden>Wróć do aplikacji</a></div></main>
  <script type="module">
    import {resetForFreshStart} from './reset.js';
    try {
      resetForFreshStart(localStorage,true);
      location.replace('./');
    } catch {
      document.querySelector('#reset-status').textContent='Nie udało się wyczyścić zapisanych danych. Sprawdź ustawienia przechowywania danych tej strony w przeglądarce.';
      document.querySelector('#reset-return').hidden=false;
    }
  </script>
</body>
</html>
